name: "Prepare node"
description: "Prepares node by installing node + dependencies"

inputs:
  npm_token:
    description: "may be needed to checkout submodules"
    required: true
  checkout_modules:
    description: "whether to checkout all submodules"
    required: false
  npm_registry:
    description: which npm registry to use
    required: false
    default: "https://npm.pkg.github.com"
  with_cache:
    description: whether to use a pnpm cache
    required: false
    default: "true"
  run_install:
    description: whether to run install
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Checkout submodules using a PAT
      shell: bash
      if: ${{ inputs.checkout_modules == true }}
      run: |
        git config --file .gitmodules --get-regexp url | while read url; do
          git config --file=.gitmodules $(echo "$url" | sed -E "s/git@github.com:|https:\/\/github.com\//https:\/\/${{ inputs.NPM_TOKEN }}:${{ inputs.NPM_TOKEN }}@github.com\//")
        done
        git submodule sync
        git submodule update --init --recursive

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: setup node.js lts
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: ${{ (inputs.with_cache == true ||  inputs.with_cache == 'true') && 'pnpm' || '' }}
        registry-url: ${{ inputs.npm_registry }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm_token }}

    - name: install node packages
      if: ${{ inputs.run_install == true ||  inputs.run_install == 'true' }}
      shell: bash
      run: pnpm install
